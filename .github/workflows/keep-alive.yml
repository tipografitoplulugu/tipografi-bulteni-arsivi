name: Keep Streamlit App Awake

on:
  schedule:
    # Runs every 6 hours (00:15, 06:15, 12:15, 18:15 UTC)
    - cron: '15 */6 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping-app:
    name: Keep-Alive Probe
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: .github/scripts/package-lock.json

      - name: Install dependencies
        working-directory: .github/scripts
        run: |
          npm ci
          npx puppeteer browsers install chrome

      - name: Run Puppeteer Keep-Alive Probe
        working-directory: .github/scripts
        env:
          APP_URL: 'https://tipografi-bulteni-arsivi.streamlit.app/'
        run: node keep_alive.js
